<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beatriz</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<canvas id="particulas" aria-hidden="true"></canvas>

<header class="topo">
  <div class="marca">
    <img src="logo.png" alt="">
    <div><span class="nome">BEATRIZ</span><span class="sub" id="sub-marca">Sistema iniciando…</span></div>
  </div>
  <div class="chips">
    <span class="chip" id="chip-llm"><i class="ponto"></i><span>LLM</span></span>
    <span class="chip" id="chip-escuta"><i class="ponto"></i><span>escuta</span></span>
    <span class="chip" id="chip-modo"><span>modo padrão</span></span>
  </div>
  <div class="acoes-topo">
    <button class="botao-sistema" id="btn-agenda">[ Agenda ]</button>
    <button class="botao-sistema" id="btn-status">[ Status ]</button>
    <button class="botao-sistema" id="btn-registro">[ Registro ]</button>
    <div class="relogio"><span id="hora">--:--</span><span id="data"></span></div>
  </div>
</header>

<main class="palco">
  <section class="ceu" id="ceu" aria-label="Missões em andamento">
    <div class="titulo-ceu">[ MISSÕES ]</div>
    <p class="ceu-vazio" id="ceu-vazio">Nenhuma missão no céu.<br>Peça um documento, uma planilha ou uma pesquisa completa.</p>
  </section>

  <section class="centro">
    <div class="nucleo estado-repouso" id="nucleo"></div>

    <div class="legendas" aria-live="polite">
      <p class="legenda voce" id="legenda-voce"></p>
      <p class="legenda beatriz" id="legenda-beatriz"></p>
    </div>
  </section>

  <section class="notificacoes" id="notificacoes" aria-live="polite"></section>

  <aside class="lado-agenda" id="lado-agenda" aria-label="Agenda e calendário">
    <div class="titulo-ceu">[ AGENDA ]</div>
    <div class="mini-cal-cab">
      <button class="seta" id="mc-anterior" aria-label="Mês anterior">‹</button>
      <span id="mc-titulo"></span>
      <button class="seta" id="mc-seguinte" aria-label="Próximo mês">›</button>
    </div>
    <div class="mini-cal" id="mini-cal" role="grid"></div>
    <div class="dia-tela">
      <div class="dia-tela-titulo" id="dt-titulo">HOJE</div>
      <ul class="dia-tela-itens" id="dt-itens"></ul>
    </div>
    <p class="lado-agenda-rodape" id="lado-rodape"></p>
    <button class="pequeno" id="lado-abrir">abrir a agenda</button>
  </aside>
</main>

<aside class="registro" id="registro" aria-label="Registro da conversa">
  <div class="cabecalho-janela">[ REGISTRO ]<button class="fechar" data-fechar="registro" aria-label="Fechar">×</button></div>
  <div class="atalhos" id="atalhos"></div>
  <div class="mensagens" id="mensagens"></div>
</aside>

<div class="fundo-modal" id="fundo-status" hidden>
  <div class="janela-sistema janela-status" id="janela-status" role="dialog" aria-label="Status da Beatriz">
    <div class="cabecalho-janela">[ STATUS ]<button class="fechar" data-fechar="status" aria-label="Fechar">×</button></div>
    <div id="conteudo-status"></div>
  </div>
</div>

<div class="fundo-modal" id="fundo-agenda" hidden>
  <div class="janela-sistema janela-agenda" id="janela-agenda" role="dialog" aria-label="Agenda">
    <div class="cabecalho-janela">[ AGENDA ]<button class="fechar" data-fechar="agenda" aria-label="Fechar">×</button></div>
    <div class="agenda-topo">
      <div class="agenda-nav">
        <button class="pequeno aba-agenda ativo" data-vista="semana">semana</button>
        <button class="pequeno aba-agenda" data-vista="mes">mês</button>
        <span class="agenda-nav-espaco"></span>
        <button class="pequeno" id="ag-anterior" aria-label="Anterior">‹</button>
        <button class="pequeno" id="ag-hoje">esta semana</button>
        <button class="pequeno" id="ag-proxima" aria-label="Seguinte">›</button>
        <span id="ag-titulo"></span>
      </div>
      <p class="agenda-proximo" id="ag-proximo"></p>
    </div>
    <div class="agenda-corpo">
      <div class="agenda-semana" id="ag-semana"></div>
      <div class="agenda-mes" id="ag-mes" hidden></div>
      <aside class="agenda-lado">
        <div class="agenda-secao">TAREFAS</div>
        <ul class="agenda-tarefas" id="ag-tarefas"></ul>
        <input id="ag-nova-tarefa" placeholder="Nova tarefa… ex.: pagar boleto até sexta" autocomplete="off">
        <div class="agenda-secao">ROTINA</div>
        <p class="agenda-rotina" id="ag-rotina"></p>
      </aside>
    </div>
    <input id="ag-pedido" class="agenda-pedido" autocomplete="off"
           placeholder="Marcar ou perguntar… ex.: dentista amanhã às 14h · academia toda segunda às 7h · estou livre sexta à tarde?">
    <p class="agenda-resposta" id="ag-resposta" aria-live="polite"></p>
  </div>
</div>

<footer class="comando">
  <button class="mic ativo" id="btn-mic" title="Microfone ligado (clique para pausar)" aria-label="Microfone">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none"/></svg>
  </button>
  <input id="entrada" placeholder="Fale com a Beatriz ou digite um comando…" autocomplete="off" spellcheck="true">
  <button class="icone" id="btn-anexar" title="Anexar arquivos à biblioteca" aria-label="Anexar arquivos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5 12.5 19a5 5 0 0 1-7-7l8-8a3.3 3.3 0 0 1 4.7 4.7l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3" fill="none"/></svg>
  </button>
  <button class="enviar" id="btn-enviar">Enviar</button>
</footer>

<script src="nucleo.js"></script>
<script src="app.js"></script>
</body>
</html>
